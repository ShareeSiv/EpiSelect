# @package _global_
# The paper's 124M EpiSelect run (Table 1; Appendix E.1: same model, data, seed, optimizer and schedule) with the
# own-weight-1 fit, trained in PyTorch on one NVIDIA GPU by scripts/train_torch.py. Launch with
# scripts/gpu/launch_124M.sh, which splits each step's 256 sequences into microbatches that fit the GPU.
# The paper's fit on the same hardware, for a like-for-like baseline: loader.fit_method=paper
defaults:
  - override /model: 124M
  - override /loader: commonpile_episelect
seed: 21
tag: 124M-run-NVIDIA
multihost: false

eval_batch_size: 256  # the paper's val set (150 x 256 sequences), whatever batch_size is
ckpt_max_to_keep: 3   # each checkpoint is ~2 GB (params + adam state)
compile: true         # torch.compile the forward and loss

loader:
  fit_method: own
  fit_data_path: ${rundir}/fit_data_{step}.npz  # for scripts/compare_fits.py afterwards
