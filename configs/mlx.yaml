# small-model runs on the Mac GPU: python scripts/train_mlx.py data_dir=/path/to/commonpile_tfds
defaults:
  - model: mlx_10M
  - loader: mlx_episelect
  - sampler: commonpile
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_

rundir: null    # local path; defaults to outputs/mlx/<timestamp>
seed: 0
data_dir: null  # common_pile_grouped tfds dir, built with scripts/build_commonpile_tfds.py

# code and math/science domains, which are likely to transfer to each other, plus general text
tasks:
  - stackv2_edu
  - github
  - stackexchange
  - arxiv_papers
  - pes2o
  - pubmed
  - wikimedia
  - cc_common_crawl

learning_rate: 1e-3
min_lr: 1e-5
beta2: 0.95
weight_decay: 1e-4
warmup_steps: 200
lr_decay_steps: 12000
max_steps: 12000  # 12000 x 32 x 256 = 98M tokens
lr_schedule: wsd  # the scaling law is only fit on the stable phase
wsd_decay_frac: 0.2

batch_size: 32
block_size: 256
g_accum_iters: 1
tf32: true  # fp32 params, matmuls in tf32 (~1.9x faster on the M5 GPU); false for full fp32

eval_interval: 250
val_seqs_per_domain: 128
log_interval: 20

hydra:
  output_subdir: null
  run:
    dir: .
