defaults:
  - model: 124M
  - loader: commonpile_episelect
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_

rundir: null    # local path or gs:// URI
seed: 0
tag: null       # optional wandb tag
debug: false    # skip checkpointing and wandb logging
multihost: true # initialize the JAX distributed runtime (TPU pods)

learning_rate: 1e-3
min_lr: 1e-5
beta2: 0.95
weight_decay: 1e-4
warmup_steps: 500
lr_decay_steps: 60000
max_steps: 60000
lr_schedule: cosine  # cosine | wsd (warmup-stable-decay)
wsd_decay_frac: 0.2  # wsd: fraction of max_steps spent decaying at the end

batch_size: 256  # global across all devices
block_size: 1024
g_accum_iters: 1
param_dtype: float32
compute_dtype: bfloat16
shard_model: false

eval_interval: 1000
eval_batch_size: null  # null = batch_size

data_format: tfds      # tfds (common_pile_grouped) | compact (uint16 memmaps, scripts/build_compact_commonpile.py)
ckpt_keep: null        # model checkpoints to keep, null = all
time_budget_h: null    # stop cleanly (checkpointed) after this many hours, e.g. a kaggle session; rerun to resume
allow_selector_reset: false  # resume even if the selector state for the checkpoint is missing
pbar_full_metrics: true      # every metric in the progress bar (false: loss, lr, val loss)
pbar_mininterval: 0.1        # seconds between progress bar refreshes

hydra:
  output_subdir: null
  run:
    dir: .
